name: job-intelligence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_intelligence
      POSTGRES_USER: jobapp
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-jobapp_local}
      TZ: Asia/Dhaka
    volumes:
      - job_intelligence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobapp -d job_intelligence']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - job_intelligence_redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobapp:${LOCAL_DB_PASSWORD:-jobapp_local}@db:5432/job_intelligence
      DATABASE_MODE: local
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 4000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-asdfasdf}
      DEFAULT_CANDIDATE_PASSWORD: ${DEFAULT_CANDIDATE_PASSWORD:-asdfasdf}
      CANDIDATE_SESSION_SECRET: ${CANDIDATE_SESSION_SECRET:-local-development-session-secret-2026-change-before-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/admin/settings').then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jobapp:${LOCAL_DB_PASSWORD:-jobapp_local}@db:5432/job_intelligence
      DATABASE_MODE: local
      SKIP_DB_MIGRATIONS: 'true'
      AUTO_SEED_IF_EMPTY: 'false'
      TZ: Asia/Dhaka
      DAILY_CRAWL_HOUR: ${DAILY_CRAWL_HOUR:-6}
      DAILY_CRAWL_MINUTE: ${DAILY_CRAWL_MINUTE:-15}
      RUN_DAILY_ON_START: ${RUN_DAILY_ON_START:-false}
    depends_on:
      backend:
        condition: service_healthy
    command: ['node', 'scripts/docker-scheduler.mjs']

volumes:
  job_intelligence_pgdata:
  job_intelligence_redisdata:
