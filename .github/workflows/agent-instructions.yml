name: Agent instruction integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .agents/scripts/check-instructions.mjs
